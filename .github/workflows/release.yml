name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - id: bump
        run: |
          VERSION=$(python3 scripts/release.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: cut release
        if: steps.bump.outputs.version != steps.bump.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.json .codex-plugin/plugin.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip-release]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
          gh release create "v${{ steps.bump.outputs.version }}" --generate-notes --title "v${{ steps.bump.outputs.version }}"
